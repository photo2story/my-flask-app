  <!-- OAuth 브랜딩: noscript에만 개인정보처리방침 링크 (봇 파싱용). 고정 푸터 제거 → Flutter 대시보드 스크롤 끝에만 표시 -->
  <noscript>
    <p style="padding:12px;text-align:center;font-size:12px;">
      <a href="/privacy.html">Privacy Policy</a> | <a href="/terms.html">Terms of Service</a>
    </p>
  </noscript>
  <!-- 로그인 등 모든 팝업을 화면 중앙에 열기 -->
  <script>
    (function () {
      var nativeOpen = window.open.bind(window);
      function centeredOpen(url, name, specs) {
        var w = 500, h = 600;
        var left = Math.round((screen.width - w) / 2);
        var top = Math.round((screen.height - h) / 2);
        var s = (specs == null || specs === undefined) ? '' : String(specs);
        if (s.indexOf('left') === -1) s += (s ? ',' : '') + 'left=' + left;
        if (s.indexOf('top') === -1) s += (s ? ',' : '') + 'top=' + top;
        if (s.indexOf('width') === -1) s += (s ? ',' : '') + 'width=' + w;
        if (s.indexOf('height') === -1) s += (s ? ',' : '') + 'height=' + h;
        return nativeOpen(url, name, s);
      }
      function install() {
        window.open = centeredOpen;
        if (window.top && window.top !== window) window.top.open = centeredOpen;
      }
      install();
      if (document.readyState !== 'complete') {
        window.addEventListener('load', install);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
